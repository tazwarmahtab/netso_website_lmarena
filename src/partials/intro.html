<!-- ============================ INTRO CURTAIN ============================
     Logo over a live brand gradient that dissolves into the hero.

     Rules this follows (all standing constraints):
     * It never delays understanding — it is a CSS animation that ends by
       itself at 1.7 s whether or not JavaScript ever runs. No JS gate.
     * prefers-reduced-motion: never rendered at all (CSS hides it).
     * Repeat views in the same session: skipped via a class set in <head>
       before first paint, so there is no flash.
     * pointer-events: none throughout, so a visitor can always interact
       with the page beneath, and any scroll/click/key just removes it.
     * aria-hidden + no focusable content: nothing here reaches a screen
       reader or the tab order.
     ====================================================================== -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro__grad"></div>
  <div class="intro__grid"></div>
  <div class="intro__logo">
    <svg viewBox="0 0 26 22" fill="none" focusable="false">
      <path d="M1.6 12.1 13 2.2l11.4 9.9" stroke="currentColor" stroke-width="2.1" stroke-linecap="square"/>
      <path d="M6.1 11.6v7.3m13.8-7.3v7.3M6.1 18.9h13.8" stroke="currentColor" stroke-width="1.35"/>
      <path d="M5.1 15.4h15.8" stroke="currentColor" stroke-width="1.35"/>
      <circle class="intro__sun" cx="19.6" cy="4.6" r="2.5" fill="#E3841B"/>
    </svg>
    <span class="intro__word">NETSO</span>
    <span class="intro__sub">Energy · Bangladesh</span>
  </div>
  <div class="intro__rule"><span></span></div>
</div>
